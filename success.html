<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الدفع بنجاح</title>
    <!-- استدعاء مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: #fff; text-align: center; padding-top: 50px; font-family: sans-serif; }
        .success-box { background: #111; padding: 40px; border-radius: 20px; border: 1px solid #deff9a; display: inline-block; }
        h1 { color: #deff9a; }
        a.button { display: inline-block; margin-top: 20px; padding: 15px 30px; background: #deff9a; color: #000; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="success-box">
        <h1>✅ تم الدفع وتفعيل الاشتراك بنجاح</h1>
        <h2 id="welcomeName"></h2>
        <p>تمت إضافة الفروع إلى حسابك.</p>
        <a href="salasapp://" class="button">العودة إلى التطبيق</a> <!-- استبدل salasapp بمسار تطبيقك -->
    </div>

    <script>
        // 1. قراءة البيانات من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const branches = urlParams.get('branches');
        const tapId = urlParams.get('tap_id'); // أضافتها Tap تلقائياً

        const savedName = localStorage.getItem('merchantName') || 'عميلنا العزيز';
        document.getElementById('welcomeName').innerText = `شكراً لك ${savedName}`;

        // 2. تحديث قاعدة البيانات في Supabase
        if (userId && branches) {
            // ⚠️ ضع بيانات مشروعك هنا
            const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
            const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
            
            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            async function updateMerchantProfile() {
                // تاريخ الانتهاء بعد سنة (365 يوم) من الآن
                const expiryDate = new Date();
                expiryDate.setDate(expiryDate.getDate() + 365);

                const { data, error } = await supabase
                    .from('profiles')
                    .update({ 
                        allowed_branches: parseInt(branches),
                        subscription_end_date: expiryDate.toISOString()
                    })
                    .eq('id', userId);

                if (error) console.error("خطأ في تحديث قاعدة البيانات:", error);
                else console.log("تم التفعيل بنجاح!");
            }

            updateMerchantProfile();
        }
    </script>
</body>
</html>
