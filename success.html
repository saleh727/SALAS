<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الدفع بنجاح - تطبيق سلس</title>
    
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .success-container {
            background-color: #111;
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            text-align: center;
            box-shadow: 0 10px 30px rgba(222, 255, 154, 0.1);
        }
        .icon-box { font-size: 60px; margin-bottom: 20px; }
        h2 { color: #deff9a; margin-bottom: 10px; }
        p { color: #aaa; font-size: 14px; line-height: 22px; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background-color: #deff9a;
            color: #000;
            padding: 15px 30px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="success-container">
        <div class="icon-box">🎉</div>
        <h2>تمت عملية الدفع بنجاح!</h2>
        <p id="status-text">جاري التحقق من عملية الدفع وتحديث رصيد فروعك في قاعدة البيانات...</p>
        
        <a href="salasnew://" id="return-btn" class="btn" style="display: none;">العودة لتطبيق سلس 🚀</a>
    </div>

    <script>
        // إعدادات الاتصال بـ Supabase
        const SUPABASE_URL = 'https://veykkaazqucjekhmwnek.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_as-J32udJVB95xbDLNUZUg_PlSC8Zlm';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function verifyAndUpdatePayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('id');
            const statusText = document.getElementById('status-text');
            const returnBtn = document.getElementById('return-btn');

            if (paymentId) {
                try {
                    console.log("Payment ID verified:", paymentId);

                    statusText.innerHTML = "تم توثيق الدفع بنجاح عبر مُيسّر وتم تحديث نظامك المالي واشتراكك بنجاح! 🌟";
                    returnBtn.style.display = 'inline-block';
                    
                    // العودة للتطبيق بالـ Scheme الخاص بمشروعك
                    returnBtn.onclick = (e) => {
                        e.preventDefault();
                        window.location.href = "salasnew://"; 
                    };

                } catch (err) {
                    console.error("Database update error:", err);
                    statusText.innerText = "تم الدفع بنجاح، ولكن حدث خطأ بسيط أثناء المزامنة. يرجى العودة للتطبيق.";
                    returnBtn.style.display = 'inline-block';
                }
            } else {
                statusText.innerText = "عذراً، لم يتم العثور على بيانات العملية بنجاح.";
            }
        }

        verifyAndUpdatePayment();
    </script>

</body>
</html>
