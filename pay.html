<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع - تطبيق سلس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111111;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #deff9a;
            font-size: 24px;
        }
        p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .amount-display {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
        }
        .amount-display span {
            font-size: 18px;
            color: #deff9a;
        }
        button {
            background-color: #deff9a;
            color: #000;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loader {
            display: none;
            border: 3px solid #333;
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 15px auto 0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>دفع الاشتراك</h2>
        <p>تتم عملية الدفع بشكل آمن ومشفر بالكامل عبر بوابة Tap Payments</p>
        
        <div class="amount-display">
            <span id="displayAmount">0</span> <span>ر.س</span>
        </div>

        <button id="payBtn" onclick="startPayment()">متابعة الدفع</button>
        <div class="loader" id="loader"></div>
    </div>

    <script>
        // سحب المبلغ وعدد الفروع من الرابط (الذي يرسله التطبيق)
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '0';
        const branches = urlParams.get('branches') || '1';

        // عرض المبلغ في الشاشة
        document.getElementById('displayAmount').innerText = amount;

        async function startPayment() {
            const btn = document.getElementById('payBtn');
            const loader = document.getElementById('loader');
            
            btn.disabled = true;
            btn.innerText = "جاري تجهيز الفاتورة...";
            loader.style.display = 'block';

            try {
                // الرابط الجديد للدالة السحابية الخاصة بمشروعك
                const supabaseFunctionUrl = 'https://veykkaazqucjekhmwnek.supabase.co/functions/v1/tap-payment';
                
                const response = await fetch(supabaseFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        amount: amount,
                        branches: branches
                    })
                });

                const data = await response.json();
                
                // التوجيه لصفحة الدفع الآمنة من Tap
                if (data && data.transaction && data.transaction.url) {
                    window.location.href = data.transaction.url;
                } else {
                    alert('حدث خطأ فني أثناء إنشاء الفاتورة.');
                    console.log("Response Data:", data);
                    resetButton(btn, loader);
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                console.error("Fetch Error:", error);
                resetButton(btn, loader);
            }
        }

        function resetButton(btn, loader) {
            btn.disabled = false;
            btn.innerText = "متابعة الدفع";
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
