<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفع اشتراك سلس</title>
    <style>
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { 
            background-color: #111; 
            border: 1px solid #222; 
            border-radius: 20px; 
            padding: 30px; 
            max-width: 400px; 
            margin: 40px auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo { width: 80px; height: 80px; margin-bottom: 10px; border-radius: 20px; }
        .title { font-size: 22px; color: #deff9a; margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 25px; }
        
        .receipt-box {
            background-color: #0d0d0d;
            border: 1px dashed #333;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 15px; }
        .row-total { display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 15px; font-size: 18px; font-weight: bold; color: #deff9a; }
        
        .pay-btn { 
            background-color: #deff9a; 
            color: #000; 
            border: none; 
            padding: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            transition: 0.3s; 
        }
        .pay-btn:hover { background-color: #c1e67b; }
        .pay-btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        
        .loader { display: none; margin-top: 15px; color: #888; font-size: 14px; }
        .security-badge { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <!-- يمكنك تغيير الرابط بصورة شعار تطبيق سلس الخاص بك -->
        <img src="https://ui-avatars.com/api/?name=S&background=deff9a&color=000&size=100&rounded=true" alt="Salas Logo" class="logo">
        <h1 class="title">تجديد باقة المستشار المالي</h1>
        <p class="subtitle">إتمام عملية الدفع لتفعيل الفروع</p>

        <div class="receipt-box">
            <div class="row">
                <span>عدد الفروع:</span>
                <span id="branchesCount">1</span>
            </div>
            <div class="row">
                <span>سعر الفرع:</span>
                <span>69 ر.س</span>
            </div>
            <div class="row-total">
                <span>الإجمالي الدفع:</span>
                <span><span id="totalAmount">69</span> ر.س</span>
            </div>
        </div>

        <button id="payBtn" class="pay-btn" onclick="startPayment()">ادفع الآن عبر Tap 💳</button>
        <div id="loader" class="loader">جاري إنشاء الفاتورة الآمنة... ⏳</div>
        
        <div class="security-badge">
            🔒 مدفوعاتك محمية ومشفرة بالكامل
        </div>
    </div>

    <script>
        // 1. استخراج عدد الفروع من الرابط (مثال: ?branches=2)
        const urlParams = new URLSearchParams(window.location.search);
        const branches = parseInt(urlParams.get('branches')) || 1;
        const amount = branches * 69;

        // 2. تحديث الأرقام في الشاشة
        document.getElementById('branchesCount').innerText = branches;
        document.getElementById('totalAmount').innerText = amount;

        // 3. مفتاح Tap Payments (بيئة الاختبار التي أرسلتها لي)
        const SECRET_KEY = 'sk_test_iMDkzAfXrgL9ThG8c2PQujVv';

        // 4. دالة بدء الدفع
        async function startPayment() {
            const btn = document.getElementById('payBtn');
            const loader = document.getElementById('loader');
            
            btn.disabled = true;
            btn.innerText = "يرجى الانتظار...";
            loader.style.display = 'block';

            try {
                // الاتصال بـ API الخاص بـ Tap لإنشاء رابط الدفع
                const response = await fetch('https://api.tap.company/v2/charges', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SECRET_KEY}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        currency: 'SAR',
                        threeDSecure: true,
                        save_card: false,
                        description: `اشتراك تطبيق سلس - ${branches} فروع`,
                        statement_descriptor: 'تطبيق سلس',
                        customer: {
                            first_name: 'تاجر',
                            last_name: 'سلس',
                            email: 'merchant@salas.app',
                            phone: {
                                country_code: '+966',
                                number: '500000000'
                            }
                        },
                        source: { id: 'src_all' }, // إظهار كل وسائل الدفع (مدى، أبل باي، فيزا)
                        redirect: {
                            // هذا الرابط سيعود إليه التاجر بعد الدفع، سنقوم بإنشائه لاحقاً
                            url: 'https://saleh727.github.io/SALAS/success.html' 
                        }
                    })
                });

                const data = await response.json();
                
                // إذا تم إنشاء الفاتورة بنجاح، قم بتوجيه التاجر لصفحة الدفع
                if (data && data.transaction && data.transaction.url) {
                    window.location.href = data.transaction.url;
                } else {
                    alert('حدث خطأ فني أثناء إنشاء الفاتورة. يرجى المحاولة لاحقاً.');
                    console.log(data);
                    resetButton(btn, loader);
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم، يرجى التحقق من الإنترنت.');
                console.error(error);
                resetButton(btn, loader);
            }
        }

        function resetButton(btn, loader) {
            btn.disabled = false;
            btn.innerText = "ادفع الآن عبر Tap 💳";
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
