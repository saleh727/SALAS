<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الدفع - تطبيق سلس</title>
    <!-- ... (نفس أكواد الستايل السابقة) ... -->
</head>
<body>
    <div class="card">
        <h2>تأكيد الاشتراك</h2>
        <div id="merchantName" class="merchant-name">مرحباً بك</div>
        <button id="payBtn" onclick="startPayment()">متابعة الدفع</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const branches = urlParams.get('branches') || '1';
        const userId = urlParams.get('userId') || '';
        const userName = urlParams.get('userName') || '';

        if (userName) localStorage.setItem('merchantName', userName);
        document.getElementById('merchantName').innerText = `مرحباً بك، ${userName}`;

        async function startPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerText = "جاري تحويلك لبوابة الدفع...";

            try {
                // ⚠️ ضع رابط الدالة السحابية (Edge Function) الخاص بك هنا
                const supabaseFunctionUrl = 'https://YOUR_PROJECT_REF.supabase.co/functions/v1/tap-payment';
                
                const response = await fetch(supabaseFunctionUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: branches * 69, // حسبناها بناء على الفروع
                        branches: branches,
                        userId: userId,
                        userName: userName
                    })
                });

                const data = await response.json();
                
                if (data && data.transaction && data.transaction.url) {
                    window.location.href = data.transaction.url; // التوجيه لصفحة بطاقة الصراف
                } else {
                    alert('خطأ في الاتصال بالبوابة.');
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم.');
            }
        }
    </script>
</body>
</html>
