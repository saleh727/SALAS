<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التاجر - دفع الاشتراك</title>
    
    <!-- مكتبات مُيسّر الأساسية -->
    <link rel="stylesheet" href="https://cdn.moyasar.com/mpf/1.7.3/moyasar.css" />
    <script src="https://polyfill.io/v3/polyfill.min.js?features=fetch"></script>
    <script src="https://cdn.moyasar.com/mpf/1.7.3/moyasar.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .checkout-container {
            background-color: #111;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(222, 255, 154, 0.1);
        }
        .header-title {
            color: #deff9a;
            text-align: center;
            margin-bottom: 5px;
            font-size: 20px;
        }
        .plan-info {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .mysr-form { background: transparent !important; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2 class="header-title">ترقية باقة المستشار المالي</h2>
        <p id="plan-description" class="plan-info">جاري تحميل تفاصيل الاشتراك...</p>

        <!-- حاوية نموذج الدفع لميسر -->
        <div class="mysr-form"></div>
    </div>

    <script>
        // قراءة عدد الفروع من الرابط القادم من التطبيق (مثال: pay.html?branches=2)
        const urlParams = new URLSearchParams(window.location.search);
        const branchesCount = parseInt(urlParams.get('branches')) || 1;
        
        // حساب المبلغ (69 ريال لكل فرع = بالهللات 6900 * العدد)
        const pricePerBranch = 6900;
        const totalAmount = branchesCount * pricePerBranch;
        const totalInSAR = branchesCount * 69;

        // تحديث النص في الصفحة ليطابق اختيار التاجر
        document.getElementById('plan-description').innerText = 
            `ترقية عدد (${branchesCount} فروع) - الإجمالي: ${totalInSAR} ر.س (شامل الضريبة)`;

        // تشغيل بوابة ميسر بالمبلغ المحدث
        Moyasar.init({
            element: '.mysr-form',
            amount: totalAmount, 
            currency: 'SAR',
            description: `اشتراك تطبيق سلس - ${branchesCount} فروع`,
            publishable_api_key: 'pk_test_QJCHKrp3H7U1PpeAZCnxgFTYbZ6zQrMd6kPRd63S',
            callback_url: 'https://saleh727.github.io/SALAS/success.html', 
            methods: ['creditcard', 'applepay', 'stcpay']
        });
    </script>

</body>
</html>
