<script>
        const urlParams = new URLSearchParams(window.location.search);
        const amount = urlParams.get('amount') || '0';
        const branches = urlParams.get('branches') || '1';
        const userId = urlParams.get('userId') || ''; // التقاط معرف التاجر

        document.getElementById('displayAmount').innerText = amount;

        async function startPayment() {
            const btn = document.getElementById('payBtn');
            const loader = document.getElementById('loader');
            
            btn.disabled = true;
            btn.innerText = "جاري تجهيز الفاتورة...";
            loader.style.display = 'block';

            try {
                const supabaseFunctionUrl = 'https://veykkaazqucjekhmwnek.supabase.co/functions/v1/tap-payment';
                
                const response = await fetch(supabaseFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZleWtrYWF6cXVjamVraG13bmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTExNDgsImV4cCI6MjA5NDMyNzE0OH0.28s7JbWu9oqqcnRqfogsoBpc4F_RJfsBDhrFNNcQMVw'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        branches: branches,
                        userId: userId // إرسال المعرف للدالة السحابية
                    })
                });

                const data = await response.json();
                
                if (data && data.transaction && data.transaction.url) {
                    window.location.href = data.transaction.url;
                } else {
                    alert('حدث خطأ فني أثناء إنشاء الفاتورة.');
                    console.log("Response Data:", data);
                    resetButton(btn, loader);
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                console.error("Fetch Error:", error);
                resetButton(btn, loader);
            }
        }

        function resetButton(btn, loader) {
            btn.disabled = false;
            btn.innerText = "متابعة الدفع";
            loader.style.display = 'none';
        }
    </script>
