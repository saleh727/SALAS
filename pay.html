<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدفع - تطبيق قيم</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #111;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            color: #deff9a;
            margin-bottom: 5px;
            font-size: 24px;
        }
        /* 🌟 تنسيق اسم التاجر الجديد 🌟 */
        .merchant-name {
            color: #fff;
            font-size: 18px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .amount-box {
            background-color: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .amount {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }
        .currency {
            font-size: 16px;
            color: #deff9a;
            margin-right: 5px;
        }
        button {
            background-color: #deff9a;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }
        #loader {
            display: none;
            margin-top: 15px;
            color: #deff9a;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>تأكيد الاشتراك</h2>
        <!-- 🌟 المكان الذي سيظهر فيه اسم التاجر 🌟 -->
        <div id="merchantName" class="merchant-name">مرحباً بك</div>
        <p>سيتم تحويلك الآن لبوابة الدفع الآمنة</p>
        
        <div class="amount-box">
            <span class="amount" id="displayAmount">0</span>
            <span class="currency">ر.س</span>
        </div>

        <button id="payBtn" onclick="startPayment()">متابعة الدفع</button>
        <div id="loader">⏳ جاري تجهيز الفاتورة، يرجى الانتظار...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const branches = urlParams.get('branches') || '1';
        const userId = urlParams.get('userId') || '';
        const userName = urlParams.get('userName') || ''; // 🌟 التقاط اسم التاجر
        
        const amount = (parseInt(branches) * 69).toString(); 

        document.addEventListener("DOMContentLoaded", () => {
            const displayElement = document.getElementById('displayAmount');
            if (displayElement) {
                displayElement.innerText = amount;
            }

            // 🌟 طباعة اسم التاجر إذا كان موجوداً في الرابط 🌟
            const nameElement = document.getElementById('merchantName');
            if (nameElement && userName) {
                nameElement.innerText = 'مرحباً بك، ' + userName;
            }
        });

        async function startPayment() {
            const btn = document.getElementById('payBtn');
            const loader = document.getElementById('loader');
            
            btn.disabled = true;
            btn.innerText = "جاري تجهيز الفاتورة...";
            loader.style.display = 'block';

            try {
                const supabaseFunctionUrl = 'https://veykkaazqucjekhmwnek.supabase.co/functions/v1/tap-payment';
                
                const response = await fetch(supabaseFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZleWtrYWF6cXVjamVraG13bmVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NTExNDgsImV4cCI6MjA5NDMyNzE0OH0.28s7JbWu9oqqcnRqfogsoBpc4F_RJfsBDhrFNNcQMVw'
                    },
                    body: JSON.stringify({
                        amount: amount,
                        branches: branches,
                        userId: userId
                    })
                });

                const data = await response.json();
                
                if (data && data.transaction && data.transaction.url) {
                    window.location.href = data.transaction.url;
                } else {
                    alert('حدث خطأ فني أثناء إنشاء الفاتورة.');
                    console.log("Response Data:", data);
                    resetButton(btn, loader);
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم. تأكد من اتصالك بالإنترنت.');
                console.error("Fetch Error:", error);
                resetButton(btn, loader);
            }
        }

        function resetButton(btn, loader) {
            btn.disabled = false;
            btn.innerText = "متابعة الدفع";
            loader.style.display = 'none';
        }
    </script>
</body>
</html>
